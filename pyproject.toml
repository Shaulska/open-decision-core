[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "open-decision-core-preview"
version = "0.2.0"
description = "Experimental time-aware decision-evidence audit"
requires-python = ">=3.10"
[project.scripts]
odc = "odc.__main__:main"
[tool.setuptools]
packages = ["odc"]
